services:
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.98.8}
    container_name: tailscale-node
    hostname: ${TS_HOSTNAME:-pc-01}
    network_mode: host
    restart: unless-stopped
    cap_add:
      - net_admin
      - net_raw
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_AUTH_ONCE: ${TS_AUTH_ONCE:-true}
      TS_HOSTNAME: ${TS_HOSTNAME:-pc-01}
      TS_STATE_DIR: ${TS_STATE_DIR:-/var/lib/tailscale}
      TS_ACCEPT_DNS: ${TS_ACCEPT_DNS:-false}
      TS_USERSPACE: ${TS_USERSPACE:-false}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---login-server=https://vpn.example.com}
    volumes:
      - ./state:/var/lib/tailscale
